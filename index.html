<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Budget</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #eeede9;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b66;
      --text-tertiary: #9e9e98;
      --border: rgba(0,0,0,0.10);
      --border-strong: rgba(0,0,0,0.18);
      --green: #1D9E75;
      --green-bg: #E1F5EE;
      --red: #D85A30;
      --red-bg: #FAECE7;
      --amber: #BA7517;
      --amber-bg: #FAEEDA;
      --blue: #378ADD;
      --blue-bg: #E6F1FB;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow: 0 1px 4px rgba(0,0,0,0.07), 0 0 0 0.5px rgba(0,0,0,0.08);
      --font: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1a;
        --bg-secondary: #252523;
        --bg-tertiary: #2e2e2b;
        --text-primary: #f0efe9;
        --text-secondary: #9e9e98;
        --text-tertiary: #6b6b66;
        --border: rgba(255,255,255,0.10);
        --border-strong: rgba(255,255,255,0.18);
        --green-bg: #0d3d2c;
        --red-bg: #3d1a0d;
        --amber-bg: #3d2600;
        --blue-bg: #0d2a3d;
        --shadow: 0 1px 4px rgba(0,0,0,0.3), 0 0 0 0.5px rgba(255,255,255,0.06);
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.5;
    }

    /* Layout */
    .app-shell { display: flex; min-height: 100vh; }

    .sidebar {
      width: 220px;
      background: var(--bg-primary);
      border-right: 0.5px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 10;
    }

    .sidebar-logo {
      padding: 0 1.25rem 1.5rem;
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 0.75rem;
    }
    .sidebar-logo span { color: var(--green); }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 1.25rem;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 0;
      transition: background 0.1s, color 0.1s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--font);
    }
    .nav-item i { font-size: 18px; }
    .nav-item:hover { background: var(--bg-secondary); color: var(--text-primary); }
    .nav-item.active { background: var(--bg-secondary); color: var(--text-primary); font-weight: 500; }
    .nav-item.active i { color: var(--green); }

    .main {
      margin-left: 220px;
      flex: 1;
      padding: 2rem;
      max-width: 900px;
    }

    /* Header */
    .page-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }
    .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .page-subtitle { font-size: 14px; color: var(--text-secondary); }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Metric cards */
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.75rem; }
    .metric {
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.25rem;
      box-shadow: var(--shadow);
    }
    .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-value { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
    .metric-value.positive { color: var(--green); }
    .metric-value.negative { color: var(--red); }
    .metric-value.neutral { color: var(--text-primary); }

    /* Cards */
    .card {
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-title { font-size: 13px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.75rem; }

    /* Transactions */
    .tx-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .tx-item:last-child { border-bottom: none; padding-bottom: 0; }
    .tx-item:first-child { padding-top: 0; }
    .tx-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .tx-info { flex: 1; min-width: 0; }
    .tx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
    .tx-amount { font-size: 14px; font-weight: 600; flex-shrink: 0; }
    .tx-amount.expense { color: var(--red); }
    .tx-amount.income { color: var(--green); }

    /* Form */
    .form-section { margin-bottom: 1.5rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
    .form-group input, .form-group select {
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 14px;
      color: var(--text-primary);
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
    }
    .form-group select option { background: var(--bg-primary); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: var(--font);
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-danger { background: var(--red); color: #fff; font-size: 12px; padding: 5px 10px; }
    .btn-danger:hover { opacity: 0.85; }

    /* Progress */
    .progress-bar { height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    /* Budget & Debt cards */
    .budget-item, .debt-item {
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 10px;
    }
    .budget-head, .debt-head {
      display: flex; justify-content: space-between; align-items: center;
    }
    .item-name { font-size: 14px; font-weight: 500; }
    .item-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* Chart */
    .chart-wrap { position: relative; width: 100%; height: 200px; }

    /* Cat legend */
    .cat-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
    .cat-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
    .cat-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

    /* Badge */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }

    /* Empty */
    .empty { text-align: center; padding: 2rem 1rem; color: var(--text-tertiary); font-size: 14px; }
    .empty i { font-size: 32px; display: block; margin-bottom: 8px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: var(--text-primary); color: var(--bg-primary);
      padding: 10px 20px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }

    /* Responsive */
    @media (max-width: 700px) {
      .sidebar { width: 60px; }
      .sidebar-logo, .nav-item span { display: none; }
      .nav-item { justify-content: center; padding: 12px; }
      .main { margin-left: 60px; padding: 1rem; }
      .metric-grid { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">Mon<span>Budget</span></div>
    <button class="nav-item active" onclick="switchTab('dashboard')">
      <i class="ti ti-layout-dashboard"></i><span>Tableau de bord</span>
    </button>
    <button class="nav-item" onclick="switchTab('add')">
      <i class="ti ti-plus-circle"></i><span>Transactions</span>
    </button>
    <button class="nav-item" onclick="switchTab('budget')">
      <i class="ti ti-target"></i><span>Budget</span>
    </button>
    <button class="nav-item" onclick="switchTab('debts')">
      <i class="ti ti-credit-card"></i><span>Dettes</span>
    </button>
  </aside>

  <main class="main">

    <!-- DASHBOARD -->
    <div id="panel-dashboard" class="panel active">
      <div class="page-header">
        <div>
          <div class="page-title">Tableau de bord</div>
          <div class="page-subtitle" id="month-label"></div>
        </div>
      </div>
      <div class="metric-grid" id="metrics"></div>
      <div class="grid-2">
        <div class="card">
          <div class="card-title">Dépenses par catégorie</div>
          <div class="cat-legend" id="cat-legend"></div>
          <div class="chart-wrap"><canvas id="catChart" role="img" aria-label="Graphique des dépenses par catégorie">Répartition des dépenses.</canvas></div>
        </div>
        <div class="card">
          <div class="card-title">Budget du mois</div>
          <div id="budget-dash"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Transactions récentes</div>
        <div id="tx-dash"></div>
      </div>
    </div>

    <!-- ADD TRANSACTION -->
    <div id="panel-add" class="panel">
      <div class="page-header">
        <div class="page-title">Transactions</div>
      </div>
      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-title">Nouvelle transaction</div>
        <div class="form-section">
          <div class="form-grid">
            <div class="form-group">
              <label>Type</label>
              <select id="tx-type">
                <option value="expense">Dépense</option>
                <option value="income">Revenu</option>
              </select>
            </div>
            <div class="form-group">
              <label>Montant (€)</label>
              <input type="number" id="tx-amount" placeholder="0.00" min="0" step="0.01">
            </div>
            <div class="form-group">
              <label>Description</label>
              <input type="text" id="tx-desc" placeholder="ex : Courses Carrefour">
            </div>
            <div class="form-group">
              <label>Catégorie</label>
              <select id="tx-cat">
                <option value="alimentation">🛒 Alimentation</option>
                <option value="transport">🚇 Transport</option>
                <option value="logement">🏠 Logement</option>
                <option value="sante">💊 Santé</option>
                <option value="loisirs">🎬 Loisirs</option>
                <option value="abonnements">📱 Abonnements</option>
                <option value="restaurant">🍽️ Restaurant</option>
                <option value="salaire">💼 Salaire</option>
                <option value="autre">📦 Autre</option>
              </select>
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="tx-date">
            </div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="addTransaction()"><i class="ti ti-check"></i> Ajouter</button>
      </div>
      <div class="card">
        <div class="card-title">Historique</div>
        <div id="tx-all"></div>
      </div>
    </div>

    <!-- BUDGET -->
    <div id="panel-budget" class="panel">
      <div class="page-header"><div class="page-title">Budget mensuel</div></div>
      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-title">Définir une limite</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Catégorie</label>
            <select id="bud-cat">
              <option value="alimentation">🛒 Alimentation</option>
              <option value="transport">🚇 Transport</option>
              <option value="logement">🏠 Logement</option>
              <option value="sante">💊 Santé</option>
              <option value="loisirs">🎬 Loisirs</option>
              <option value="abonnements">📱 Abonnements</option>
              <option value="restaurant">🍽️ Restaurant</option>
              <option value="autre">📦 Autre</option>
            </select>
          </div>
          <div class="form-group">
            <label>Limite mensuelle (€)</label>
            <input type="number" id="bud-limit" placeholder="ex : 400" min="0">
          </div>
        </div>
        <button class="btn btn-primary" style="margin-top:12px" onclick="addBudget()"><i class="ti ti-plus"></i> Enregistrer</button>
      </div>
      <div class="card"><div class="card-title">Mes budgets</div><div id="budget-list"></div></div>
    </div>

    <!-- DEBTS -->
    <div id="panel-debts" class="panel">
      <div class="page-header"><div class="page-title">Dettes & remboursements</div></div>
      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-title">Ajouter une dette</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Nom</label>
            <input type="text" id="debt-name" placeholder="ex : Prêt voiture">
          </div>
          <div class="form-group">
            <label>Montant total (€)</label>
            <input type="number" id="debt-total" placeholder="ex : 5000" min="0">
          </div>
          <div class="form-group">
            <label>Déjà remboursé (€)</label>
            <input type="number" id="debt-paid" placeholder="ex : 1200" min="0">
          </div>
          <div class="form-group">
            <label>Mensualité (€)</label>
            <input type="number" id="debt-monthly" placeholder="ex : 200" min="0">
          </div>
        </div>
        <button class="btn btn-primary" style="margin-top:12px" onclick="addDebt()"><i class="ti ti-plus"></i> Ajouter</button>
      </div>
      <div class="card"><div class="card-title">Mes dettes</div><div id="debt-list"></div></div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  let transactions = [
    { id:1, type:'expense', amount:85.50, desc:'Courses Monoprix', cat:'alimentation', date:'2026-05-15' },
    { id:2, type:'expense', amount:31.20, desc:'Pass Navigo', cat:'transport', date:'2026-05-14' },
    { id:3, type:'income',  amount:2400,  desc:'Salaire mai', cat:'salaire', date:'2026-05-10' },
    { id:4, type:'expense', amount:55,    desc:'Restaurant entre amis', cat:'restaurant', date:'2026-05-12' },
    { id:5, type:'expense', amount:12.99, desc:'Netflix', cat:'abonnements', date:'2026-05-01' },
  ];
  let budgets = [
    { cat:'alimentation', limit:300 },
    { cat:'transport', limit:80 },
    { cat:'loisirs', limit:150 },
  ];
  let debts = [
    { id:1, name:'Prêt étudiant', total:8000, paid:3200, monthly:150 },
  ];
  let nextId = 20;
  let catChartInstance = null;

  const catColors = {
    alimentation:'#1D9E75', transport:'#378ADD', logement:'#7F77DD',
    sante:'#D85A30', loisirs:'#D4537E', abonnements:'#BA7517',
    restaurant:'#639922', salaire:'#0F6E56', autre:'#888780'
  };
  const catLabels = {
    alimentation:'Alimentation', transport:'Transport', logement:'Logement',
    sante:'Santé', loisirs:'Loisirs', abonnements:'Abonnements',
    restaurant:'Restaurant', salaire:'Salaire', autre:'Autre'
  };
  const catEmojis = {
    alimentation:'🛒', transport:'🚇', logement:'🏠', sante:'💊',
    loisirs:'🎬', abonnements:'📱', restaurant:'🍽️', salaire:'💼', autre:'📦'
  };

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function switchTab(name) {
    document.querySelectorAll('.nav-item').forEach((b, i) => {
      b.classList.toggle('active', ['dashboard','add','budget','debts'][i] === name);
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    if (name === 'dashboard') renderDashboard();
    if (name === 'add') renderTxAll();
    if (name === 'budget') renderBudgets();
    if (name === 'debts') renderDebts();
  }

  function getCurrentMonth() {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
  }

  function getMonthTx() {
    const m = getCurrentMonth();
    return transactions.filter(t => t.date && t.date.startsWith(m));
  }

  function txHTML(t) {
    const sign = t.type === 'expense' ? '-' : '+';
    const cls = t.type === 'expense' ? 'expense' : 'income';
    const bg = t.type === 'expense' ? 'var(--red-bg)' : 'var(--green-bg)';
    return `<div class="tx-item">
      <div class="tx-icon" style="background:${bg}">${catEmojis[t.cat]||'💰'}</div>
      <div class="tx-info">
        <div class="tx-name">${t.desc}</div>
        <div class="tx-meta">${catLabels[t.cat]||t.cat} · ${t.date}</div>
      </div>
      <div class="tx-amount ${cls}">${sign}${t.amount.toFixed(2)} €</div>
    </div>`;
  }

  function renderDashboard() {
    const mTx = getMonthTx();
    const income  = mTx.filter(t => t.type==='income').reduce((s,t) => s+t.amount, 0);
    const expense = mTx.filter(t => t.type==='expense').reduce((s,t) => s+t.amount, 0);
    const balance = income - expense;

    const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const now = new Date();
    document.getElementById('month-label').textContent = `${months[now.getMonth()]} ${now.getFullYear()}`;

    document.getElementById('metrics').innerHTML = `
      <div class="metric"><div class="metric-label">Revenus</div><div class="metric-value positive">+${income.toFixed(2)} €</div></div>
      <div class="metric"><div class="metric-label">Dépenses</div><div class="metric-value negative">-${expense.toFixed(2)} €</div></div>
      <div class="metric"><div class="metric-label">Solde net</div><div class="metric-value ${balance>=0?'positive':'negative'}">${balance>=0?'+':''}${balance.toFixed(2)} €</div></div>
    `;

    const catTotals = {};
    mTx.filter(t => t.type==='expense').forEach(t => { catTotals[t.cat] = (catTotals[t.cat]||0) + t.amount; });
    const cats = Object.keys(catTotals);
    const vals = cats.map(c => catTotals[c]);
    const colors = cats.map(c => catColors[c]||'#888780');

    document.getElementById('cat-legend').innerHTML = cats.map((c,i) =>
      `<span class="cat-legend-item"><span class="cat-dot" style="background:${colors[i]}"></span>${catLabels[c]} ${vals[i].toFixed(0)} €</span>`
    ).join('');

    if (catChartInstance) { catChartInstance.destroy(); catChartInstance = null; }
    if (cats.length > 0) {
      catChartInstance = new Chart(document.getElementById('catChart'), {
        type: 'doughnut',
        data: { labels: cats.map(c => catLabels[c]||c), datasets: [{ data: vals, backgroundColor: colors, borderWidth: 0 }] },
        options: {
          responsive: true, maintainAspectRatio: false, cutout: '65%',
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.label} : ${ctx.parsed.toFixed(2)} €` } } }
        }
      });
    }

    // Budget dash
    const budDash = document.getElementById('budget-dash');
    if (!budgets.length) { budDash.innerHTML = '<div class="empty"><i class="ti ti-target"></i>Aucun budget défini</div>'; }
    else {
      budDash.innerHTML = budgets.map(b => {
        const spent = mTx.filter(t => t.type==='expense' && t.cat===b.cat).reduce((s,t) => s+t.amount, 0);
        const pct = Math.min(100, Math.round((spent/b.limit)*100));
        const color = pct>=90 ? 'var(--red)' : pct>=70 ? 'var(--amber)' : 'var(--green)';
        return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;font-size:13px">
            <span>${catEmojis[b.cat]} ${catLabels[b.cat]}</span>
            <span style="color:var(--text-secondary)">${spent.toFixed(0)} / ${b.limit} €</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>`;
      }).join('');
    }

    const recent = [...transactions].sort((a,b) => b.date.localeCompare(a.date)).slice(0,6);
    document.getElementById('tx-dash').innerHTML = recent.length ? recent.map(txHTML).join('') : '<div class="empty"><i class="ti ti-receipt"></i>Aucune transaction</div>';
  }

  function addTransaction() {
    const type   = document.getElementById('tx-type').value;
    const amount = parseFloat(document.getElementById('tx-amount').value);
    const desc   = document.getElementById('tx-desc').value.trim();
    const cat    = document.getElementById('tx-cat').value;
    const date   = document.getElementById('tx-date').value;
    if (!amount || amount <= 0 || !desc || !date) { toast('⚠️ Remplissez tous les champs'); return; }
    transactions.unshift({ id: nextId++, type, amount, desc, cat, date });
    document.getElementById('tx-amount').value = '';
    document.getElementById('tx-desc').value = '';
    renderTxAll();
    toast('✓ Transaction ajoutée');
  }

  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    renderTxAll();
    toast('Transaction supprimée');
  }

  function renderTxAll() {
    const all = [...transactions].sort((a,b) => b.date.localeCompare(a.date));
    document.getElementById('tx-all').innerHTML = all.length
      ? all.map(t => `<div class="tx-item">
          <div class="tx-icon" style="background:${t.type==='expense'?'var(--red-bg)':'var(--green-bg)'}">${catEmojis[t.cat]||'💰'}</div>
          <div class="tx-info"><div class="tx-name">${t.desc}</div><div class="tx-meta">${catLabels[t.cat]||t.cat} · ${t.date}</div></div>
          <div class="tx-amount ${t.type==='expense'?'expense':'income'}">${t.type==='expense'?'-':'+'}${t.amount.toFixed(2)} €</div>
          <button class="btn btn-danger" style="margin-left:8px" onclick="deleteTransaction(${t.id})"><i class="ti ti-trash"></i></button>
        </div>`).join('')
      : '<div class="empty"><i class="ti ti-receipt"></i>Aucune transaction</div>';
  }

  function addBudget() {
    const cat   = document.getElementById('bud-cat').value;
    const limit = parseFloat(document.getElementById('bud-limit').value);
    if (!limit || limit <= 0) { toast('⚠️ Entrez un montant valide'); return; }
    const idx = budgets.findIndex(b => b.cat === cat);
    if (idx >= 0) budgets[idx].limit = limit; else budgets.push({ cat, limit });
    document.getElementById('bud-limit').value = '';
    renderBudgets();
    toast('✓ Budget enregistré');
  }

  function deleteBudget(cat) {
    budgets = budgets.filter(b => b.cat !== cat);
    renderBudgets();
    toast('Budget supprimé');
  }

  function renderBudgets() {
    const mTx = getMonthTx().filter(t => t.type==='expense');
    const el = document.getElementById('budget-list');
    if (!budgets.length) { el.innerHTML = '<div class="empty"><i class="ti ti-target"></i>Aucun budget défini</div>'; return; }
    el.innerHTML = budgets.map(b => {
      const spent = mTx.filter(t => t.cat===b.cat).reduce((s,t) => s+t.amount, 0);
      const pct   = Math.min(100, Math.round((spent/b.limit)*100));
      const color = pct>=90 ? 'var(--red)' : pct>=70 ? 'var(--amber)' : 'var(--green)';
      return `<div class="budget-item">
        <div class="budget-head">
          <div><div class="item-name">${catEmojis[b.cat]} ${catLabels[b.cat]}</div><div class="item-sub">${spent.toFixed(2)} € / ${b.limit.toFixed(2)} € — ${pct}% utilisé</div></div>
          <button class="btn btn-danger" onclick="deleteBudget('${b.cat}')"><i class="ti ti-trash"></i></button>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
        <div style="font-size:12px;color:var(--text-secondary)">${Math.max(0,b.limit-spent).toFixed(2)} € restants</div>
      </div>`;
    }).join('');
  }

  function addDebt() {
    const name    = document.getElementById('debt-name').value.trim();
    const total   = parseFloat(document.getElementById('debt-total').value);
    const paid    = parseFloat(document.getElementById('debt-paid').value)||0;
    const monthly = parseFloat(document.getElementById('debt-monthly').value)||0;
    if (!name || !total || total <= 0) { toast('⚠️ Remplissez les champs obligatoires'); return; }
    debts.push({ id: nextId++, name, total, paid, monthly });
    ['debt-name','debt-total','debt-paid','debt-monthly'].forEach(id => document.getElementById(id).value = '');
    renderDebts();
    toast('✓ Dette ajoutée');
  }

  function deleteDebt(id) {
    debts = debts.filter(d => d.id !== id);
    renderDebts();
    toast('Dette supprimée');
  }

  function renderDebts() {
    const el = document.getElementById('debt-list');
    if (!debts.length) { el.innerHTML = '<div class="empty"><i class="ti ti-credit-card"></i>Aucune dette enregistrée</div>'; return; }
    el.innerHTML = debts.map(d => {
      const remaining = d.total - d.paid;
      const pct = Math.min(100, Math.round((d.paid/d.total)*100));
      const months = d.monthly > 0 ? Math.ceil(remaining/d.monthly) : null;
      return `<div class="debt-item">
        <div class="debt-head">
          <div>
            <div class="item-name"><i class="ti ti-credit-card" style="vertical-align:-2px;margin-right:5px"></i>${d.name}</div>
            <div class="item-sub">Total : ${d.total.toFixed(2)} €${d.monthly ? ` · ${d.monthly} €/mois` : ''}</div>
          </div>
          <div style="text-align:right;display:flex;align-items:center;gap:10px">
            <div>
              <div style="font-size:20px;font-weight:600;color:var(--red)">${remaining.toFixed(2)} €</div>
              <div style="font-size:11px;color:var(--text-secondary)">restants${months ? ` · ~${months} mois` : ''}</div>
            </div>
            <button class="btn btn-danger" onclick="deleteDebt(${d.id})"><i class="ti ti-trash"></i></button>
          </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:var(--green)"></div></div>
        <div style="font-size:12px;color:var(--text-secondary)">${pct}% remboursé</div>
      </div>`;
    }).join('');
  }

  // Init
  document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];
  renderDashboard();
  renderTxAll();
  renderBudgets();
  renderDebts();
</script>
</body>
</html>
